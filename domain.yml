version: "3.1"

intents:
  - greet
  - thank_you
  - ask_return_order
  - ask_missing_item
  - report_damaged_product
  - ask_refund_timing
  - report_missing_package
  - ask_partner_return
  - ask_kruidvat_club
  - ask_human_handoff
  - provide_order_number
  - start_order_lookup
  - fallback

entities:
  - order_id

slots:
  order_id:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: order_id

responses:
  utter_greet:
    - text: "Hoi! Ik ben Kruidvat Hulp. Ik kan helpen met webshopbestellingen, ontbrekende artikelen, beschadigde producten, retouren, terugbetalingen en bezorgproblemen. Waarmee kan ik je helpen?"

  utter_thank_you:
    - text: "Graag gedaan! Kan ik je nog ergens anders mee helpen?"

  utter_return_order:
    - text: >
        Natuurlijk. Bij een webshopbestelling kun je meestal retourneren volgens de retourstappen van Kruidvat.
        Let wel op: bij partnerartikelen kunnen de retourstappen anders zijn dan bij gewone Kruidvat-artikelen.
        Als je een ordernummer hebt, kan ik de ordercontext controleren.

  utter_missing_item:
    - text: >
        Vervelend dat er een artikel ontbreekt. Controleer eerst of het artikel misschien apart wordt geleverd
        of op de pakbon anders vermeld staat. Bewaar de verpakking en pakbon. Met je ordernummer kan ik de
        ordercontext controleren en inschatten of medewerkerhulp nodig is.

  utter_damaged_product:
    - text: >
        Dat is vervelend. Bewaar het beschadigde artikel en de verpakking, en maak indien mogelijk duidelijke
        foto's van de schade. Bij beschadigde artikelen is vaak beoordeling nodig, zodat een medewerker kan kijken
        naar vervanging, terugbetaling of een passende oplossing.

  utter_refund_timing:
    - text: >
        De timing van een terugbetaling hangt af van de verwerking van de retour, de betaalmethode en soms ook
        of het om een partnerartikel gaat. Als je een ordernummer hebt, kan ik de ordercontext controleren.

  utter_missing_package:
    - text: >
        Als je pakket als bezorgd staat maar je hebt niets ontvangen, controleer dan eerst buren, huisgenoten
        en eventueel een afleverpunt. Als het pakket daarna nog steeds ontbreekt, is dit een order-specifieke
        situatie waarvoor medewerkerhulp meestal nodig is.

  utter_partner_return:
    - text: >
        Bij partnerartikelen kunnen retourvoorwaarden en retourstappen anders zijn dan bij gewone Kruidvat-artikelen.
        Met je ordernummer kan ik controleren of de bestelling als partnerorder bekend staat en welke vervolgstap logisch is.

  utter_kruidvat_club:
    - text: >
        Voor Kruidvat Club- of accountvragen kan de juiste vervolgstap afhangen van je accountstatus of bestelling.
        Ik kan algemene uitleg geven, maar voor persoonlijke accountgegevens is medewerkerhulp nodig.

  utter_human_handoff:
    - text: >
        Natuurlijk. Ik kan je doorzetten naar een medewerker wanneer er orderonderzoek, persoonlijke gegevens,
        foto's, partnercontext of beoordeling nodig is. Geef eventueel alvast je ordernummer en een korte uitleg van het probleem.

  utter_ask_order_number_for_context:
    - text: "Natuurlijk. Wat is je ordernummer? Dan kan ik de ordercontext controleren."

  utter_ask_order_id:
    - text: "Natuurlijk. Wat is je ordernummer? Dan kan ik de ordercontext controleren."

  utter_can_do_something_else:
    - text: "Kan ik je nog ergens anders mee helpen?"

  utter_closing_words:
    - text: "Prima, dan sluit ik dit gesprek af. Fijne dag verder!"

  utter_ask_continue_conversation:
    - text: "Kan ik je nog ergens anders mee helpen?"

  utter_internal_error_rasa:
    - text: "Er ging iets mis. Probeer het opnieuw of neem contact op met een medewerker."

  utter_human_handoff_not_available:
    - text: "Ik kan je op dit moment niet direct doorzetten, maar ik kan wel helpen met de volgende stappen."

  utter_default:
    - text: >
        Ik weet niet zeker of ik je goed begrijp. Ik kan vooral helpen met webshopbestellingen, ontbrekende artikelen,
        beschadigde producten, retouren, terugbetalingen, bezorgproblemen, partnerartikelen en medewerker-handoff.

actions:
  - action_check_order_context

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true