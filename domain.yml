version: "3.1"

intents:
  - greet
  - ask_return_order
  - ask_opened_packaging
  - report_damaged_product
  - ask_refund_timing
  - report_missing_package
  - ask_human_agent
  - thank_you
  - affirm
  - deny
  - out_of_scope
  - nlu_fallback

responses:
  utter_greet:
    - text: "Hoi! Ik ben een Xenos-geïnspireerde Rasa demo-assistent. Ik kan je helpen met algemene vragen over retourneren, beschadigde producten, bezorgproblemen en wanneer een medewerker nodig is."

  utter_return_order:
    - text: "Natuurlijk, ik help je daarmee. Voor een online bestelling kun je meestal het retourproces volgen via je bestelling of de retourinformatie op de website. Zorg dat het artikel compleet is en voeg waar nodig de pakbon of orderinformatie toe. Ik kan je ook helpen bepalen of je situatie een normale retour is of dat er een medewerker nodig is."

  utter_opened_packaging:
    - text: "Een geopende verpakking hoeft niet altijd een probleem te zijn. Vaak hangt het af van het type product en of het artikel compleet, ongebruikt en onbeschadigd is. Bij hygiëneproducten, gebruikte artikelen of producten met een verbroken verzegeling kunnen strengere regels gelden. Als je twijfelt, is het verstandig om dit door een medewerker te laten beoordelen."

  utter_damaged_product:
    - text: "Vervelend dat het product beschadigd is aangekomen. In dat geval is het beter om dit als beschadigd product te melden in plaats van als normale retour. Meestal zijn ordergegevens en foto's van de schade nodig. Ik kan je uitleggen welke informatie handig is, maar voor beoordeling van jouw specifieke bestelling is een medewerker nodig."

  utter_refund_timing:
    - text: "De terugbetaling volgt meestal nadat de retour is ontvangen en verwerkt. De exacte timing kan afhangen van de betaalmethode en verwerkingstijd. Voor een specifieke status van jouw terugbetaling is orderinformatie nodig en kan een medewerker je verder helpen."

  utter_missing_package:
    - text: "Dat is vervelend. Als je pakket als bezorgd staat maar je hebt niets ontvangen, controleer eerst of het bij buren, een huisgenoot of een afleverpunt ligt. Als het pakket daarna nog steeds ontbreekt, is dit een order-specifieke situatie en kan een medewerker helpen met verder onderzoek."

  utter_human_agent:
    - text: "Ik kan je doorverwijzen naar een medewerker wanneer er ordergegevens, foto's, persoonlijke gegevens of een inhoudelijke beoordeling nodig zijn. In deze demo verwerk ik geen echte bestellingen, maar ik laat zien wanneer een handoff logisch is."

  utter_thank_you:
    - text: "Graag gedaan! Laat het gerust weten als je nog een vraag hebt over retourneren, schade, bezorging of terugbetaling."

  utter_fallback:
    - text: "Ik weet niet zeker of ik je goed begrijp. Deze demo helpt vooral met retourneren, geopende verpakking, beschadigde producten, terugbetaling, bezorgproblemen en medewerker-handoff."

  utter_out_of_scope:
    - text: "Daar kan ik in deze demo niet mee helpen. Ik ben gericht op algemene Xenos-achtige supportvragen rond retourneren, schade, bezorging en terugbetaling."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
