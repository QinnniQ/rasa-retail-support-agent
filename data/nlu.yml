version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hoi
      - hallo
      - hey
      - goedemorgen
      - goedemiddag
      - goedenavond
      - hallo Kruidvat Hulp
      - hoi Kruidvat Hulp

  - intent: thank_you
    examples: |
      - bedankt
      - dank je
      - dankjewel
      - super bedankt
      - thanks
      - dank u wel
      - top bedankt

  - intent: ask_return_order
    examples: |
      - Ik wil mijn webshopbestelling retourneren. Wat moet ik doen?
      - Ik wil iets retourneren
      - Hoe kan ik mijn bestelling retourneren?
      - Kan ik mijn online bestelling terugsturen?
      - Hoe werkt retourneren bij Kruidvat?
      - Ik wil mijn pakket terugsturen
      - Ik wil een Kruidvat bestelling retour sturen
      - Kan ik een webshop aankoop retourneren?
      - Wat zijn de retourstappen voor een online bestelling?

  - intent: ask_missing_item
    examples: |
      - Er ontbreekt een artikel in mijn bestelling. Wat nu?
      - Er mist een artikel in mijn pakket
      - Mijn bestelling is niet compleet
      - Ik heb niet alles ontvangen
      - Er ontbreekt iets uit mijn bestelling
      - Een product zit niet in het pakket
      - Ik mis een artikel
      - Mijn pakket mist een product
      - Niet alle artikelen zijn geleverd
      - Ik heb maar een deel van mijn bestelling ontvangen

  - intent: report_damaged_product
    examples: |
      - Mijn artikel is beschadigd aangekomen. Wat moet ik doen?
      - Het product is beschadigd aangekomen
      - Mijn artikel is kapot aangekomen
      - Mijn bestelling is beschadigd
      - Het product is stuk geleverd
      - Ik heb een beschadigd artikel ontvangen
      - Mijn pakket bevat een kapot product
      - Er zit schade aan mijn bestelling
      - Het artikel is beschadigd geleverd
      - De fles is gaan lekken in het pakket
      - De verpakking was kapot en het artikel is beschadigd

  - intent: ask_refund_timing
    examples: |
      - Hoe lang duurt het voordat ik mijn geld terugkrijg?
      - Wanneer krijg ik mijn geld terug?
      - Hoe lang duurt een terugbetaling?
      - Wanneer wordt mijn retour terugbetaald?
      - Ik wacht op mijn terugbetaling
      - Hoe snel krijg ik mijn geld terug na retourneren?
      - Wanneer staat het bedrag weer op mijn rekening?
      - Hoe lang duurt de refund?
      - Mijn terugbetaling duurt lang
      - Waar blijft mijn terugbetaling?

  - intent: report_missing_package
    examples: |
      - Mijn pakket staat op bezorgd, maar ik heb niets ontvangen. Wat moet ik doen?
      - Mijn pakket is bezorgd volgens de vervoerder maar ik heb niks gekregen
      - Mijn bestelling staat op bezorgd maar is niet aangekomen
      - Het pakket is niet geleverd
      - Ik heb mijn pakket niet ontvangen
      - Mijn bestelling is kwijt
      - De bezorger zegt dat het geleverd is maar ik heb niets
      - Mijn pakket ontbreekt
      - Waar is mijn bestelling?
      - Mijn pakket is niet binnengekomen
      - Track en trace zegt bezorgd maar ik heb niets

  - intent: ask_partner_return
    examples: |
      - Hoe retourneer ik een partnerartikel?
      - Mijn bestelling is van een partner, hoe werkt retourneren?
      - Kan ik een partnerartikel terugbrengen naar de winkel?
      - Ik heb een artikel van een externe partner besteld
      - Werkt retourneren anders bij partnerartikelen?
      - Mijn order is een partnerorder
      - Wat moet ik doen met een partner retour?
      - Kan Kruidvat mijn partnerbestelling retour nemen?
      - Ik wil een partnerproduct terugsturen

  - intent: ask_kruidvat_club
    examples: |
      - Ik heb een vraag over Kruidvat Club
      - Mijn Kruidvat Club punten kloppen niet
      - Ik kan niet inloggen op mijn Kruidvat account
      - Mijn account werkt niet
      - Ik zie mijn bestelling niet in mijn account
      - Kan je mijn Kruidvat Club gegevens controleren?
      - Ik heb een probleem met mijn Kruidvat Club kaart
      - Mijn voordeel staat niet in mijn account

  - intent: ask_human_handoff
    examples: |
      - Kan ik hierover met een medewerker spreken?
      - Ik wil een medewerker spreken
      - Kan ik iemand van de klantenservice spreken?
      - Verbind me met een medewerker
      - Ik wil contact met een mens
      - Kan ik hulp krijgen van een medewerker?
      - Ik wil dit met iemand bespreken
      - Kan een medewerker dit bekijken?
      - Ik wil dit laten controleren
      - Kan iemand hiernaar kijken?

  - intent: start_order_lookup
    examples: |
      - Ik wil mijn bestelling controleren
      - Kan je mijn bestelling controleren?
      - Ik wil de status van mijn order weten
      - Kan je mijn orderstatus bekijken?
      - Ik wil weten waar mijn bestelling is
      - Controleer mijn bestelling
      - Ik wil mijn order controleren
      - Kan je mijn order nakijken?
      - Waar blijft mijn bestelling?
      - Kan je zien wat de status van mijn bestelling is?
      - Ik wil mijn ordercontext controleren
      - Kun je mijn bestelling erbij pakken?

  - intent: provide_order_number
    examples: |
      - [KV-10482](order_id)
      - Mijn ordernummer is [KV-10482](order_id)
      - Het gaat om bestelling [KV-10482](order_id)
      - Order [KV-10482](order_id)
      - Kun je [KV-10482](order_id) controleren?
      - Kan je [KV-10482](order_id) controleren?
      - Mijn bestelnummer is [KV-10482](order_id)
      - Controleer [KV-10482](order_id)
      - [KV-20991](order_id)
      - Mijn ordernummer is [KV-20991](order_id)
      - Het gaat om bestelling [KV-20991](order_id)
      - Order [KV-20991](order_id)
      - Kun je [KV-20991](order_id) controleren?
      - Kan je [KV-20991](order_id) controleren?
      - Mijn bestelnummer is [KV-20991](order_id)
      - Controleer [KV-20991](order_id)
      - [KV-77830](order_id)
      - Mijn ordernummer is [KV-77830](order_id)
      - Het gaat om bestelling [KV-77830](order_id)
      - Order [KV-77830](order_id)
      - Kun je [KV-77830](order_id) controleren?
      - Kan je [KV-77830](order_id) controleren?
      - Mijn bestelnummer is [KV-77830](order_id)
      - Controleer [KV-77830](order_id)

  - intent: fallback
    examples: |
      - Ik heb een andere vraag
      - Ik weet het niet
      - Kun je me ergens anders mee helpen?
      - Dit gaat ergens anders over
      - Geen idee
      - Dat bedoel ik niet

  - regex: order_id
    examples: |
      - KV-[0-9]{5}