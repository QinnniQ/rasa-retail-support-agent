version: "3.1"

rules:
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Thank you response
    steps:
      - intent: thank_you
      - action: utter_thank_you

  - rule: Answer Kruidvat Club question
    steps:
      - intent: ask_kruidvat_club
      - action: utter_kruidvat_club

  - rule: Human handoff
    steps:
      - intent: ask_human_handoff
      - action: utter_human_handoff
      - action: action_create_support_case

  - rule: Default fallback
    steps:
      - intent: nlu_fallback
      - action: utter_default

  - rule: Explicit unknown question
    steps:
      - intent: fallback
      - action: utter_default
