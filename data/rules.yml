version: "3.1"

rules:
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Thank you response
    steps:
      - intent: thank_you
      - action: utter_thank_you

  - rule: Answer return order question
    steps:
      - intent: ask_return_order
      - action: utter_return_order

  - rule: Answer missing item question
    steps:
      - intent: ask_missing_item
      - action: utter_missing_item

  - rule: Answer damaged product question
    steps:
      - intent: report_damaged_product
      - action: utter_damaged_product

  - rule: Answer refund timing question
    steps:
      - intent: ask_refund_timing
      - action: utter_refund_timing

  - rule: Answer missing package question
    steps:
      - intent: report_missing_package
      - action: utter_missing_package

  - rule: Answer partner return question
    steps:
      - intent: ask_partner_return
      - action: utter_partner_return

  - rule: Answer Kruidvat Club question
    steps:
      - intent: ask_kruidvat_club
      - action: utter_kruidvat_club

  - rule: Human handoff
    steps:
      - intent: ask_human_handoff
      - action: utter_human_handoff

  - rule: Default fallback
    steps:
      - intent: fallback
      - action: utter_default