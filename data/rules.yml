version: "3.1"

rules:
  - rule: Say hello
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Answer return order
    steps:
      - intent: ask_return_order
      - action: utter_return_order

  - rule: Answer opened packaging
    steps:
      - intent: ask_opened_packaging
      - action: utter_opened_packaging

  - rule: Answer damaged product
    steps:
      - intent: report_damaged_product
      - action: utter_damaged_product

  - rule: Answer refund timing
    steps:
      - intent: ask_refund_timing
      - action: utter_refund_timing

  - rule: Answer missing package
    steps:
      - intent: report_missing_package
      - action: utter_missing_package

  - rule: Human handoff
    steps:
      - intent: ask_human_agent
      - action: utter_human_agent

  - rule: Thank you
    steps:
      - intent: thank_you
      - action: utter_thank_you

  - rule: Out of scope
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: NLU fallback
    steps:
      - intent: nlu_fallback
      - action: utter_fallback
